name: Android Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=offline_ludo .
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned/debug-signed test APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Build release app bundle (requires Android signing configuration)
        if: ${{ vars.ANDROID_RELEASE_SIGNING_CONFIGURED == 'true' }}
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        if: ${{ vars.ANDROID_RELEASE_SIGNING_CONFIGURED == 'true' }}
        with:
          name: ludo-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
