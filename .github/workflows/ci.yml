name: Flutter CI
on:
  push:
    branches: [main, feat/ludo-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=offline_ludo .
          fi
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
